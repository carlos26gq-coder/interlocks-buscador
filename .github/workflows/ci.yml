name: SOLVI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solvi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/static/app.js
          node --check scripts/static/search-worker.js
          node --check scripts/static/circuit-visualizer.js
          node --check scripts/static/log-parser.js
          node --check scripts/static/multimeter.js
          node --check sw.js
